<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品登録</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>食品登録</h1>
        </header>

        <main class="main-content">
            <form id="foodForm">
                <div class="form-group">
                    <label for="foodName">食品名:</label>
                    <input type="text" id="foodName" name="foodName" required>
                </div>
                <div class="form-group">
                    <label for="expiryDate">賞味期限:</label>
                    <input type="date" id="expiryDate" name="expiryDate" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="button">登録</button>
                </div>
            </form>

            <div class="form-group">
                <button id="startScanButton" class="button">バーコードを読み取る</button>
                <canvas id="barcodeScanner" width="300" height="200" style="display: none;"></canvas>
                <button id="captureButton" class="button" style="display: none;">読み取る</button>
            </div>
        </main>

        <footer class="footer">
            <a href="dashboard.html" class="button">ホームに戻る</a>
        </footer>
    </div>

    <div id="messageBox" style="display: none;">
        <p>食品情報が登録されました</p>
        <button id="closeButton" class="button">閉じる</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.3.1/dist/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="add_food.js"></script>
</body>
</html>
