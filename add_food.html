<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品登録</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>食品登録</h1>
        </div>
        <div class="main-content">
            <form id="foodForm">
                <div class="form-group">
                    <label for="foodName">食品名</label>
                    <input type="text" id="foodName" name="foodName" required>
                </div>
                <div class="form-group">
                    <label for="expiryDate">賞味期限</label>
                    <input type="date" id="expiryDate" name="expiryDate" required>
                </div>
                <button type="submit">登録</button>
            </form>
            <button id="startScanButton" class="button">バーコードスキャンでスキャン</button>
            <canvas id="barcodeScanner"></canvas>
            <button id="captureButton" class="button">読み取る</button>
        </div>
    </div>
    <div id="messageBox" style="display: none;">
        <p>食品情報が登録されました</p>
        <button id="closeButton">閉じる</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.3.1/jsQR.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
